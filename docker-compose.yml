version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: nimitthis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nimitthis
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nimitthis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nimitthis-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.env.example
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/nimitthis
      REDIS_URL: redis://redis:6379
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nimitthis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  redis-data:
